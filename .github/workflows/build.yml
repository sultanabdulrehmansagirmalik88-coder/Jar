name: Create release and upload repo files as release assets

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Set to "true" to create a release and upload files as assets'
        required: false
        default: 'false'
      release_tag:
        description: 'Release tag to use when creating a release (used only if create_release is true)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
      - master

jobs:
  release-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release (if requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          release_name: Release ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false

      - name: Upload all tracked files to the Release as assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ steps.create_release.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          echo "Uploading files to $UPLOAD_URL"

          git ls-files | while IFS= read -r file; do
            echo "Uploading: $file"
            filename_enc=$(python3 -c "import sys,urllib.parse as u; print(u.quote(sys.argv[1]))" "$file")
            curl -sSf -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "$UPLOAD_URL?name=$filename_enc" || echo "Failed to upload $file"
          done
        shell: bash
