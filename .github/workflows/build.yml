name: Zip repository and upload

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Set to "true" to also create a GitHub Release and upload the zip as an asset'
        required: false
        default: 'false'
      release_tag:
        description: 'Release tag to use when creating a release (used only if create_release is true)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
      - master

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP of repository
        run: |
          ZIP_NAME="${{ github.repository }}-${{ github.sha }}.zip"
          # exclude .git directory and GitHub workflow files inside .github/workflows if you want:
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/workflows/*"
          echo "Created $ZIP_NAME"
        shell: bash

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-zip
          path: ${{ github.repository }}-${{ github.sha }}.zip

      - name: Create GitHub Release (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          release_name: Release ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false

      - name: Upload ZIP to Release (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.repository }}-${{ github.sha }}.zip
          asset_name: ${{ github.repository }}-${{ github.sha }}.zip
          asset_content_type: application/zip
